[project]
name = "guichet-unique"
version = "2.0.0"
description = "Extraction des inscriptions periscolaire/cantine depuis espace-citoyens.net"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "icalendar>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "tenacity>=9.0.0",
    "websockets>=13.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
scheduler = [
    "apscheduler>=3.10.0",
]
web = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4,<3.2",
    "python-multipart>=0.0.20",
]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
]

[project.scripts]
guichet = "guichet_unique.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guichet_unique"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
